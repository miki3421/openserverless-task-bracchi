version: "3"
tasks:

  tests:
    desc: tests

  util:
    desc: util

  update:
    desc: Deploys updates for Openserverless components

  upgrade:
    desc: migrate a supported local installation using the protected upgrade profile
    silent: true
    env:
      OPS_UPGRADE_REQUEST: >-
        {"check":{{toJson (default false .__check)}},"status":{{toJson (default false .status)}},"resume":{{toJson (default false .resume)}},"json":{{toJson (default false .__json)}}}
    cmds:
      - bun upgrade/main.ts



  backup:
    desc: capture a supported installation and verify its encrypted file recovery
    silent: true
    env:
      OPS_BACKUP_REQUEST: >-
        {"check":{{toJson (default false .__check)}},"status":{{toJson (default false .status)}},"json":{{toJson (default false .__json)}},"prepare":{{toJson (default false .prepare)}}}
    cmds:
      - bun backup/main.ts

  restore:
    desc: restore a verified native backup into an explicitly bound empty rehearsal cluster
    silent: true
    env:
      OPS_RESTORE_REQUEST: >-
        {"check":{{toJson (default false .__check)}},"status":{{toJson (default false .status)}},"json":{{toJson (default false .__json)}},"reset":{{toJson (default false .reset)}}}
    cmds:
      - bun restore/main.ts

  migrate:
    desc: migrate a qualified legacy installation to the selected target version
    silent: true
    env:
      OPS_MIGRATE_REQUEST: >-
        {"prepare":{{toJson (default false .prepare)}},"status":{{toJson (default false .status)}},"to":{{toJson (default "" .__to)}},"from":{{toJson (default "" .__from)}},"toColon":{{toJson (default false (index . "__to:0.9.0"))}},"fromColon":{{toJson (default false (index . "__from:k3s"))}},"key":{{toJson (default "" .__key_file)}},"snapshot":{{toJson (default "" .__snapshot)}},"check":{{toJson (default false .__check)}},"json":{{toJson (default false .__json)}}}
    cmds:
      - bun migrate/main.ts
